<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="panel" role="main">
    <!-- Header -->
    <header class="panel-header" role="banner">
      <div class="header-left">
        <div class="logo" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5z" fill="#fff" opacity="0.9"/>
            <path d="M2 17l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
            <path d="M2 12l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <div>
          <div class="title">ApplyPie</div>
          <div class="subtitle" id="connectionStatus" role="status" aria-live="polite">Connecting...</div>
        </div>
      </div>
      <div class="header-actions" role="toolbar" aria-label="Controls">
        <button class="icon-btn terminate" id="terminateBtn" title="Terminate all operations" aria-label="Terminate all operations" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M15 9l-6 6M9 9l6 6"/>
          </svg>
        </button>
        <button class="icon-btn" id="stopBtn" title="Stop current request" aria-label="Stop current request" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button class="icon-btn" id="clearBtn" title="Clear chat" aria-label="Clear chat history">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M5 6l1 14a1 1 0 001 1h10a1 1 0 001-1l1-14"/></svg>
        </button>
      </div>
    </header>

    <!-- Progress Banner (shown during auto-apply) -->
    <div class="progress-banner" id="progressBanner" style="display:none;" role="status" aria-live="polite">
      <div class="progress-info">
        <span class="progress-text" id="progressText">Applying...</span>
        <button class="progress-terminate" id="progressTerminate" aria-label="Stop auto-apply">Stop</button>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <!-- Quick Actions -->
    <nav class="quick-actions" id="quickActions" aria-label="Quick actions">
      <button class="action-chip" data-command="Apply to all Easy Apply jobs on this page. If not on a jobs page, navigate there first." aria-label="Auto apply to all jobs">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Auto Apply
      </button>
      <button class="action-chip" data-command="Search for software engineer jobs and auto-apply to all Easy Apply listings" aria-label="Search and apply">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        Search & Apply
      </button>
      <button class="action-chip" data-command="Apply to the currently selected job" aria-label="Apply to current job">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        Apply Current
      </button>
      <button class="action-chip" data-command="Show my application stats" aria-label="View stats">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        Stats
      </button>
    </nav>

    <!-- Messages Area -->
    <div class="messages" id="messages" role="log" aria-label="Chat messages" aria-live="polite">
      <div class="message assistant">
        <div class="msg-content">
          <p>Hey! I'm <strong>ApplyPie</strong> — your AI job application assistant.</p>
          <p>Tell me what role you're looking for and I'll handle everything: navigating, searching, filling forms, and submitting applications.</p>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <footer class="input-area">
      <div class="input-wrapper" role="search">
        <textarea id="userInput" placeholder="e.g. Apply to remote Python developer jobs..." rows="1" aria-label="Message input"></textarea>
        <button class="send-btn" id="sendBtn" title="Send message" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-footer">
        <div class="status-indicator" role="status" aria-live="polite">
          <span id="statusDot" class="status-dot" aria-hidden="true"></span>
          <span id="statusLabel">Ready</span>
        </div>
        <span class="powered-by">Powered by Appy Pie</span>
      </div>
    </footer>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
