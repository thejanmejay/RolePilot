<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5z" fill="#fff" opacity="0.9"/>
          <path d="M2 17l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M2 12l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <h1>ApplyPie</h1>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="setup">Setup</button>
      <button class="nav-tab" data-tab="profile">Profile</button>
      <button class="nav-tab" data-tab="usage">Usage</button>
    </div>

    <!-- Setup -->
    <div id="tab-setup" class="tab active">
      <div class="field">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="Enter your API key">
        <div class="hint">Provided by your organization</div>
      </div>
      <button class="btn primary" id="saveKey">Save & Validate</button>
      <button class="btn demo" id="demoMode">Use Demo Mode (Real Claude via local proxy)</button>
      <button class="btn mock" id="mockMode">Use Mock Mode (Simulated, no AI)</button>
      <div id="keyStatus" class="status-msg"></div>

      <hr>

      <button class="btn secondary" id="openPanel">Open Assistant Panel</button>
      <div class="hint center">Navigate to LinkedIn first, then open the panel</div>
    </div>

    <!-- Profile -->
    <div id="tab-profile" class="tab">
      <!-- Resume Upload Section -->
      <div class="resume-upload-section">
        <label class="upload-label" for="resumeFile">
          <div class="upload-icon">&#128196;</div>
          <div class="upload-text">
            <span class="upload-title" id="uploadTitle">Upload Resume (PDF/TXT)</span>
            <span class="upload-hint">AI will auto-fill your profile</span>
          </div>
        </label>
        <input type="file" id="resumeFile" accept=".pdf,.txt" style="display:none">
        <button class="btn analyze" id="analyzeResume" style="display:none">Analyze with AI</button>
        <div id="resumeStatus" class="status-msg"></div>
      </div>

      <div class="divider-text"><span>or fill manually</span></div>

      <div class="field">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="John Doe">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="text" id="email" placeholder="john@example.com">
      </div>
      <div class="field">
        <label>Phone</label>
        <input type="text" id="phone" placeholder="+1234567890">
      </div>
      <div class="field">
        <label>Location</label>
        <input type="text" id="location" placeholder="San Francisco, CA">
      </div>
      <div class="field">
        <label>Years of Experience</label>
        <input type="text" id="experience" placeholder="5">
      </div>
      <div class="field">
        <label>Resume Summary</label>
        <textarea id="resumeSummary" rows="4" placeholder="Brief summary of your skills, experience, and what you're looking for..."></textarea>
      </div>
      <button class="btn primary" id="saveProfile">Save Profile</button>
      <div id="profileStatus" class="status-msg"></div>
    </div>

    <!-- Usage -->
    <div id="tab-usage" class="tab">
      <div class="stats-grid">
        <div class="stat">
          <div class="stat-value" id="statCalls">0</div>
          <div class="stat-label">API Calls</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statInput">0</div>
          <div class="stat-label">Input Tokens</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statOutput">0</div>
          <div class="stat-label">Output Tokens</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="statLast">Never</div>
          <div class="stat-label">Last Used</div>
        </div>
      </div>
      <button class="btn secondary" id="resetStats">Reset Stats</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
