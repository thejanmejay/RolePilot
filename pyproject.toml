[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-hunter"
version = "0.1.0"
description = "CLI tool for automated LinkedIn job searching and Easy Apply"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "playwright-stealth>=1.0.6",
    "click>=8.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pdfplumber>=0.10",
    "rich>=13.0",
]

[project.scripts]
linkedin-hunter = "linkedin_hunter.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "backend", "tests"]
extraPaths = [".", "src"]
pythonVersion = "3.11"
venvPath = "linkedin-hunter"
venv = ".venv"
